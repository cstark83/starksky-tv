name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Add TMDB key (optional repo secret TMDB_KEY)
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          if [ -n "$TMDB_KEY" ]; then printf '%s\n' "$TMDB_KEY" > app/src/main/assets/tmdb_key.txt; fi

      - name: Add Overseerr API key (optional repo secret OVERSEERR_API_KEY)
        env:
          OVERSEERR_API_KEY: ${{ secrets.OVERSEERR_API_KEY }}
        run: |
          # Fills only the apikey= line; the url/remote lines stay as committed. The value is never echoed.
          if [ -n "$OVERSEERR_API_KEY" ]; then
            f=app/src/main/assets/overseerr.txt
            awk '/^apikey=/ { print "apikey=" ENVIRON["OVERSEERR_API_KEY"]; next } { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          fi

      - name: Add signing key (repo secret STARKSKY_KEYSTORE_B64, required)
        env:
          KS: ${{ secrets.STARKSKY_KEYSTORE_B64 }}
        run: |
          # Same key on every build, so each build installs over the old one. The key is not in git (2026-11-23).
          if [ -z "$KS" ]; then echo "secret STARKSKY_KEYSTORE_B64 is missing"; exit 1; fi
          printf '%s' "$KS" | base64 -d > app/starksky-debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon

      # (2026-11-27) no upload-artifact step any more: the APK is in the release below; a private repo on the free plan has
      # only 500 MB of artifact storage, and a full quota would fail the build before the release is published.

      - name: Publish release (so the APK has a direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Starsky TV build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
